name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:app
      # Real PostgreSQL: ubuntu runners ship PostgreSQL binaries; the script starts a temporary cluster.
      - run: node scripts/pg-test-cluster.mjs with -- node --test apps/multitenant-blog/tests/postgres.test.mjs apps/multitenant-blog/tests/matrix.test.mjs
        env:
          SYNA_PG_BIN: /usr/lib/postgresql/16/bin
      # The gate's own tooling (step runner process groups, cluster script signal forwarding).
      - run: npm run test:scripts
        env:
          SYNA_PG_BIN: /usr/lib/postgresql/16/bin
      # The seven examples (apps/01-* … apps/07-*) assert their own results and each prints `<name>: OK`.
      - run: npm run demo
      # Self-asserting three-cell demo of the reference application (exit 1 unless every cell — HTTP alpha, HTTP beta, static alpha — answers 200 with the tenant's page).
      - run: npm run demo:multitenant-blog

  # The release gate (G0 + G1: archive, rebuild from the archive, pack, consumer smoke, manifest) with its outputs kept
  # as a workflow artifact. The gate reads the version from package.json (scripts/verify-release.mjs, 1.0.0-rc.1 on), so
  # the artifact name carries it and the release profile of that version names the validation directory. The v0.5 gate's first cloud run: 2026-09-05, run 33995206873
  # on 09e2931 in github.com/synajs/syna-v05, the workspace's home before github.com/synajs/syna (success; COMPLETE 710/710
  # on PostgreSQL 16 / Node 22), see work/v05/STATE.md. Since 0.6 the gates record the same-machine benchmark comparison
  # as "not comparable" on a runner that differs from the baseline machine (the comparison is evidence only on that
  # machine; see docs/VALIDATION.md); with a shallow checkout the baseline commit cannot be exported for the same-session
  # comparison either.
  release-gate:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The artifact name carries the workspace version; its path is the directory the release profile of that version
      # names, which since the first public candidate is the public lineage `validation/public/synajs-v<package version>-release/`.
      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "validation=$(node -p "require('./scripts/release-profiles/$version.json').constants.validation?.release ?? 'validation/v$version-release'")" >> "$GITHUB_OUTPUT"
      - run: node scripts/verify-release.mjs --release
        env:
          SYNA_PG_BIN: /usr/lib/postgresql/16/bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: syna-v${{ steps.version.outputs.version }}-release-gate
          if-no-files-found: warn
          path: |
            work/release/*.tar.gz
            work/release/*.zip
            work/release/pack/*.tgz
            ${{ steps.version.outputs.validation }}/
            RELEASE_MANIFEST.json
